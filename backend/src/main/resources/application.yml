spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:stockflow}}
    username: ${DB_USER:stockflow}
    password: ${DB_PASSWORD:local-change-me}
  jpa:
    hibernate.ddl-auto: validate
    open-in-view: false
    properties.hibernate.jdbc.time_zone: UTC
  flyway.enabled: true
server:
  port: ${PORT:8080}
  error.include-message: never
management.endpoints.web.exposure.include: health,info,prometheus
springdoc.swagger-ui.path: /swagger-ui.html
app.jwt-secret: ${JWT_SECRET:local-development-secret-at-least-32-characters}
