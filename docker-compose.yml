services:
  db:
    image: postgres:16.9-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-stockflow}
      POSTGRES_USER: ${POSTGRES_USER:-stockflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-change-me}
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U stockflow"], interval: 5s, timeout: 5s, retries: 10}
  api:
    build: ./backend
    environment:
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-stockflow}
      DB_USER: ${POSTGRES_USER:-stockflow}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-local-change-me}
      JWT_SECRET: ${JWT_SECRET}
    ports: ["8080:8080"]
    depends_on: {db: {condition: service_healthy}}
  web:
    build: ./frontend
    ports: ["5173:80"]
    depends_on: [api]
volumes: {postgres_data: {}}
